name: Publish npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump before publish
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing (OIDC) needs npm ≥ 11.5.1; Node 22 ships npm 10 → E404 on PUT.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install
        run: npm ci

      - name: Configure git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" -m "chore: release %s"

      - name: Resolve version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing contexai@$VERSION"

      - name: Align tag with package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Skip if already published
        id: skip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "contexai@${VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "contexai@${VERSION} is already on npm - nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.skip.outputs.already == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          PACKAGE_EXISTS=false
          if npm view "$NAME" name >/dev/null 2>&1; then
            PACKAGE_EXISTS=true
          fi

          if [ "$PACKAGE_EXISTS" != true ]; then
            echo "::error::$NAME is not on npm yet."
            echo "OIDC Trusted Publishing cannot create a package's first version."
            echo "Do a one-time local publish, then configure Trusted Publisher:"
            echo "  npm login"
            echo "  npm run build"
            echo "  npm publish --access public"
            echo "Docs: docs/publishing.md"
            # Still allow a valid bypass-2FA token to bootstrap, but fail loudly if none/invalid.
            if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
              exit 1
            fi
            echo "NPM_TOKEN is set — attempting first publish with the token…"
          fi

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Using repository secret NPM_TOKEN"
            printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
            npm whoami || true
          else
            echo "NPM_TOKEN is not set — using npm Trusted Publishing (OIDC)"
            unset NODE_AUTH_TOKEN
            for rc in "$HOME/.npmrc" .npmrc; do
              if [ -f "$rc" ]; then
                sed -i '/_authToken/d' "$rc"
              fi
            done
          fi

          if ! npm publish --access public --provenance; then
            echo "::error::npm publish failed."
            if [ "$PACKAGE_EXISTS" != true ]; then
              echo "First publish of $NAME must succeed with a Bypass-2FA granular token,"
              echo "or (recommended) publish once locally with npm login + OTP."
            else
              echo "Package exists but publish failed. Common causes:"
              echo "  - npm < 11.5.1 with Trusted Publishing → misleading E404 on PUT (workflow upgrades npm)"
              echo "  - Trusted Publisher env/workflow name mismatch on npmjs.com"
              echo "  - NPM_TOKEN set but invalid/2FA → delete the secret and use OIDC"
            fi
            exit 1
          fi

      - name: Push release commit and tag
        if: github.event_name == 'workflow_dispatch' && steps.skip.outputs.already == 'false'
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${{ steps.version.outputs.version }}"
