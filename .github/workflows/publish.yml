name: Publish npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump before publish
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm ≥ 11.5.1 and Node ≥ 22.14.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install
        run: npm ci

      - name: Configure git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" -m "chore: release %s"

      - name: Resolve version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing contexai@$VERSION"

      - name: Align tag with package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Skip if already published
        id: skip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "contexai@${VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "contexai@${VERSION} is already on npm - nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # OIDC only — do not inject NPM_TOKEN here (empty/placeholder tokens break auth).
      - name: Publish to npm (OIDC Trusted Publishing)
        if: steps.skip.outputs.already == 'false'
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"

          if ! npm view "$NAME" name >/dev/null 2>&1; then
            echo "::error::$NAME is not on npm yet. Publish once locally, then configure Trusted Publisher."
            echo "  npm login && npm run build && npm publish --access public"
            echo "Docs: docs/publishing.md"
            exit 1
          fi

          # Strip setup-node auth so npm uses OIDC, not an empty/_authToken.
          unset NODE_AUTH_TOKEN || true
          unset NPM_CONFIG_USERCONFIG || true
          for rc in "$HOME/.npmrc" .npmrc /home/runner/work/_temp/.npmrc; do
            if [ -f "$rc" ]; then
              sed -i '/_authToken/d;/always-auth/d' "$rc" || true
            fi
          done

          echo "Publishing $NAME@$VERSION via Trusted Publishing (OIDC)"
          if ! npm publish --access public --provenance; then
            echo "::error::npm publish failed (E404 usually means Trusted Publisher mismatch or missing 'npm publish' permission)."
            echo "On https://www.npmjs.com/package/$NAME → Settings → Trusted Publisher:"
            echo "  Organization or user: gonmedtara"
            echo "  Repository: Contexai   (exact case)"
            echo "  Workflow filename: publish.yml"
            echo "  Environment: (leave empty)"
            echo "  Allowed actions: must include npm publish (not only npm stage publish)"
            echo "Existing connections cannot be edited — delete and recreate if wrong."
            echo "Docs: docs/publishing.md"
            exit 1
          fi

      - name: Push release commit and tag
        if: github.event_name == 'workflow_dispatch' && steps.skip.outputs.already == 'false'
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${{ steps.version.outputs.version }}"
